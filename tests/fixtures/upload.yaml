test.raw:
  url: https://upload.example/raw
  method: PUT
  file: $!FILE
  headers:
    Content-Type: application/octet-stream

test.multipart:
  url: https://upload.example/multipart
  method: POST
  multipart:
    document:
      file: $!FILE
      content_type: text/plain
    description: $DESCRIPTION

test.download:
  url: https://upload.example/download
  method: GET
  output: $!FILE_PATH
